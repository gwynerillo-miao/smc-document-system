<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin / Staff Portal - St. Matthew College</title>
    <link rel="stylesheet" href="internal-portal.css">
</head>

<body>

    <!-- LOGIN CONTAINER -->
    <div class="container">

        <!-- SCHOOL LOGO -->
        <img src="logo.png" alt="School Logo" class="school-logo">

        <!-- PORTAL BADGE -->
        <div class="portal-badge">Staff / Admin Portal</div>

        <p class="portal-title">St. Matthew College — Internal Access</p>

        <!-- LOGIN FORM -->
        <form id="staffLoginForm" class="form">

            <input
                id="staffLoginId"
                type="text"
                placeholder="Staff / Admin ID"
                required
                autocomplete="off"
            >

            <div class="password-field">
                <input
                    id="staffLoginPass"
                    type="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="toggleLoginPassword"
                    aria-label="Show password"
                >
                    👁
                </button>
            </div>

            <!-- LOGIN ERROR MESSAGE -->
            <p id="loginMessage"></p>

            <button type="submit">Log In</button>

        </form>

        <p class="restricted-note">
            This portal is restricted to Registrar, Guidance, and<br>
            Administrator accounts only.
        </p>

    </div>

    <script src="internal-portal.js"></script>

</body>
</html>
